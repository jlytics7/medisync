<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Medisync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Profile</h1>
        </header>
        
        <div class="profile-card">
            <div class="profile-image">
                <img src="{{ url_for('static', filename='default-avatar.png') }}" alt="Profile Picture">
            </div>
            <div class="profile-info">
                <h2>{{ user.name }}</h2>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Role:</strong> {{ user.role }}</p>
            </div>
        </div>

        <div class="profile-actions">
            <a href="{{ url_for('edit_profile') }}" class="btn">Edit Profile</a>
            <a href="{{ url_for('dashboard') }}" class="btn secondary">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
